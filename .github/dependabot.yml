version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "@vitejs/*"
          - "vite*"
          - "typescript"
          - "oxfmt"
          - "tailwindcss"
          - "@tailwindcss/*"
      electron-deps:
        patterns:
          - "electron*"
          - "electron-builder"
      security-deps:
        patterns:
          - "argon2"
          - "better-sqlite3"
          - "jsonwebtoken"
          - "helmet"
          - "express-rate-limit"
          - "dompurify"
          - "zod"
      ui-deps:
        patterns:
          - "react*"
          - "lottie-react"
          - "@fontsource/*"
      build-deps:
        patterns:
          - "vite*"
          - "rollup*"
          - "@rollup/*"
          - "@vitejs/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    labels:
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"