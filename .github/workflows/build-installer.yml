name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-windows:
    name: Build Windows x64 Installer
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      NODE_VERSION: '22'
      BUILD_TARGET: 'electron'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Visual Studio Build Tools (C++ tooling)
        shell: powershell
        run: |
          choco install -y visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --quiet"
          RefreshEnv

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_msvs_version: '2022'

      - name: Build main process
        run: npm run build:main
        env:
          NODE_ENV: production

      - name: Build preload script
        run: npm run build:preload
        env:
          NODE_ENV: production

      - name: Build renderer
        run: npm run build:renderer
        env:
          NODE_ENV: production
          BUILD_TARGET: electron

      - name: Build installer (unpacked for verification)
        run: npm run build:dir
        env:
          NODE_ENV: production

      - name: Build NSIS installer
        run: npx electron-builder --win nsis:x64 --publish never
        env:
          NODE_ENV: production
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify installer exists
        run: |
          $installer = Get-ChildItem dist-electron/*.exe
          if (-not $installer) {
            Write-Error "No installer found in dist-electron/"
            exit 1
          }
          Write-Host "Found installer: $($installer.FullName)"
          Write-Host "Size: $([math]::Round($installer.Length / 1MB, 2)) MB"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: belko-edu-platform-installer
          path: dist-electron/*.exe
          retention-days: 30
          compression-level: 6

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist-electron/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: Run security tests on PRs
  security-check:
    name: Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build main process
        run: npm run build:main

      - name: Run security tests
        run: npm run test:security
        env:
          NODE_ENV: test

      - name: Verify CSP
        run: npm run test:csp
        env:
          NODE_ENV: test

  # Optional: Format/lint check
  lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run formatter check
        run: npm run lint